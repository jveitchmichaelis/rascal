# This workflow installs dependencies and runs tests across supported Python versions.

name: Python package

on:
  push:
    branches: [main, dev-0.3.X]
  pull_request:
    branches: [main, dev-0.3.X]

permissions:
  contents: read

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev --locked

      - name: Test with pytest
        run: uv run python -m coverage run -m pytest -v --disable-warnings -p no:warnings test

      - name: Generate Coveralls reports
        if: startsWith(matrix.os, 'ubuntu')
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: Test with pytest

  coveralls_finish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
